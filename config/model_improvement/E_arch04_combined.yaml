base_config: ../top_reconstruction_config.yaml

# Combined candidate after the three isolated paths above.
tasks:
  mask:
    mask_embed_head: true
  mask_W:
    mask_embed_head: true
  exclusive_ce:
    loss_weight: 0.25
    background: zero
    layer_weights: {0: 0.1, 1: 0.1, 2: 0.1, 3: 0.3, 4: 0.5, 5: 1.0}
  exclusive_ce_W:
    loss_weight: 0.25
    background: zero
    layer_weights: {0: 0.3, 1: 0.5, 2: 1.0, 3: 0.2, 4: 0.2, 5: 1.0}
  mask_consistency:
    loss_weight: 0.1
    margin: 0.0
    layer_weight_strategy: final_only

model_parameters:
  interaction_embedder:
    hidden_layers: [64, 64, 64]
    output_size: 8
  transformer:
    n_heads: 8
    mask_logit_scale: true

model_artefacts:
  log_dir: model_improvement/E_arch04_combined
