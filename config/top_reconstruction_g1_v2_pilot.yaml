# Short G1-v2 GPU pilot: restored recipe on a fraction of an epoch, separate log dir.
# Confirms CUDA visibility, DDP layout, loss decrease, checkpointing and that the
# restored mechanisms (masked cross-attention, embed heads, null/pad penalties)
# train cleanly before the full recovered run is submitted.
base_config: top_reconstruction_g1_v2.yaml

model_training:
  min_epochs: 1
  max_epochs: 2
  limit_train_batches: 200
  limit_val_batches: 40

model_artefacts:
  log_dir: contract_v3/G1v2_pilot
