schema_version: top-reconstruction-v3

source:
  mode: fixed_sources
  btag_provenance: simulated_binary_tag
  truthmatch_provenance: upstream_dataset_truthmatch
  # Fixed partitions are preserved; no row slicing or random re-splitting.
  sources:
    - name: hyper_train
      path: data/topquarkreconstruction/h5py_data/ttbar_h5py_raw_train.h5
      format: legacy_raw_h5
      source_file_id: 10
      split: train
    - name: inclusive_train
      path: data/topquarkreconstruction/h5py_data/ttbar_h5py_raw_inclusive_train.h5
      format: legacy_raw_h5
      source_file_id: 20
      split: train
    - name: hyper_val
      path: data/topquarkreconstruction/h5py_data/ttbar_h5py_raw_val.h5
      format: legacy_raw_h5
      source_file_id: 11
      split: val
    - name: inclusive_val
      path: data/topquarkreconstruction/h5py_data/ttbar_h5py_raw_inclusive_val.h5
      format: legacy_raw_h5
      source_file_id: 21
      split: calibration
    - name: hyper_test
      path: data/topquarkreconstruction/h5py_data/ttbar_h5py_raw_test.h5
      format: legacy_raw_h5
      source_file_id: 12
      split: test
    - name: inclusive_test
      path: data/topquarkreconstruction/h5py_data/ttbar_h5py_raw_inclusive_test.h5
      format: legacy_raw_h5
      source_file_id: 22
      split: stress

output:
  raw_path: data/topquarkreconstruction/contract_v3/ttbar_contract_raw.h5
  split_dir: data/topquarkreconstruction/contract_v3/raw_splits
  split_prefix: ttbar_contract_raw_
  manifest_path: data/topquarkreconstruction/contract_v3/manifest.json

population:
  # Keep both bits in every output row; the selected benchmark requires both.
  truth_decay: all_hadronic
  reco_lepton_veto: true

selection:
  jet_pt_min_gev: 25.0
  jet_abs_eta_max: 2.5
  min_jets: 6
  min_btags: 2
  btag_threshold: 0.0

matching:
  version: upstream-jet-truthmatch-v1
  delta_r_max: 0.4
  objective: source-label-presence
  tie_break: lowest-source-index
  exact_cardinality: true

truncation:
  max_particles: 20
  policy: retain_and_report
  order: source_order

split:
  mode: fixed_source_files
  seed: 0
  generator_group_size: 10000
  group_provenance: fixed_source_partition
  fractions:
    train: 1.0
    val: 0.0
    calibration: 0.0
    test: 0.0

conversion:
  chunk_size: 500000
  compression: gzip
  compression_level: 4

weights:
  missing_policy: unit
