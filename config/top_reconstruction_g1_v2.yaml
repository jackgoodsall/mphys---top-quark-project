# G1-v2 "recovered recipe": contract_v3 data + the mechanisms that produced the
# last-known-good model (exp_bundle_v1, 51% ttbar exact-eff on HYPER test).
#
# Provenance of every restoration (old track value -> broken baseline value):
#   transformer.masked_cross_attention : true   -> false   (query-diversity amplifier)
#   transformer.phase1_mask_overwrite  : false  -> true
#   tasks.mask.cost_bce_weight         : 0.5    -> 0.0     (BCE term in Hungarian cost)
#   mask / mask_W layer_weights        : per-layer deep supervision -> final-only
#   tasks.mask_consistency             : on     -> off     (soft W-in-top)
#   exclusive_ce / exclusive_ce_W      : on, per-layer weights -> weakened
#   null_mask_penalty                  : 0.2/0.1 -> 0.0    (+ code fix restores it in chain mode)
#   mask_embed_head / mask_logit_scale : true   -> false/false
#   scheduler                          : warmup 5, wd 0.05, T_max 100 -> warmup 1, wd 0.01, T_max 60
#
# Kept from G-track deliberately: contract_v3 fixed-source data, chain_state and
# exclusivity tasks (their ablation is a later, separate experiment), and the new
# pad_suppress_weight regulariser targeting the measured padding-logit bloat.
base_config: top_reconstruction_config.yaml

# Conscious, auditable opt-in: the restored July-era null penalty trains
# unmatched queries toward empty masks, including on slots whose truth is only
# partially known. Its silent removal (5f55d4f) contributed to the query collapse
# diagnosed on 21 Aug — see G_TRACK_HANDOFF.md before flipping this back.
gate_overrides:
  allow_null_penalty_on_censored: true

tasks:
  mask:
    cost_weight: 1.0
    dice_weight: 1.0
    bce_weight: 0.5
    cost_bce_weight: 0.5        # restored: per-particle BCE signal in match cost
    null_mask_penalty: 0.2      # restored: trains unmatched queries toward empty
    pad_suppress_weight: 0.05   # new: pushes logits negative on padding slots
    rank_weight: 0.0            # opt-in improvement, kept off for the recovery run
    mask_embed_head: true       # restored B1
    layer_weights: {0: 0.1, 1: 0.1, 2: 0.1, 3: 0.3, 4: 0.5, 5: 1.0}

  mask_W:
    cost_weight: 1.0
    dice_weight: 1.0
    bce_weight: 0.5
    cost_bce_weight: 0.5
    null_mask_penalty: 0.1
    pad_suppress_weight: 0.05
    rank_weight: 0.0
    mask_embed_head: true
    layer_weights: {0: 0.3, 1: 0.5, 2: 1.0, 3: 0.2, 4: 0.2, 5: 1.0}

  chain_state:
    enabled: true
    cost_weight: 1.0
    loss_weight: 1.0
    head_norm: true
    layer_weight_strategy: final_only

  exclusivity:
    loss_weight: 0.25

  exclusive_ce:
    background: zero
    layer_weights: {0: 0.1, 1: 0.1, 2: 0.1, 3: 0.3, 4: 0.5, 5: 1.0}

  exclusive_ce_W:
    background: zero
    layer_weights: {0: 0.3, 1: 0.5, 2: 1.0, 3: 0.2, 4: 0.2, 5: 1.0}

  mask_consistency:
    loss_weight: 0.1
    margin: 0.0
    layer_weight_strategy: final_only

model_parameters:
  transformer:
    masked_cross_attention: true
    phase1_mask_overwrite: false
    mask_logit_scale: true

data_modules:
  input_path: data/topquarkreconstruction/contract_v3/processed
  input_prefix: ttbar_contract_processed_
  min_train_objects: 1

model_training:
  weight_decay: 0.05
  scheduler:
    warmup_epochs: 5
    T_max: 100
    eta_min: 5e-6
    lr_rewarmup_fraction: 1.5
  max_epochs: 100
  min_epochs: 15

training_callbacks:
  checkpoint:
    save_top_k: 3
    monitor: "val_loss"
    mode: "min"
    save_weights_only: False
    filename: "epoch{epoch:03d}-val_loss{val_loss:.4f}"
    auto_insert_metric_name: false
    save_last: True

  # ttbar_eff is structurally capped (~26% of val events are fully matchable) and
  # sits at exactly 0 under query collapse, so it never fires as a checkpoint
  # monitor. chain_eff reacts first and tracks recovery.
  efficiency_checkpoint:
    enabled: True
    save_top_k: 1
    monitor: "val_chain_eff"
    mode: "max"
    save_weights_only: False
    filename: "epoch{epoch:03d}-val_chain_eff{val_chain_eff:.4f}"
    auto_insert_metric_name: false
    save_last: False

model_artefacts:
  log_dir: contract_v3/G1v2_recovered
  target_transformers: data/topquarkreconstruction/contract_v3/processed/target_transforms.joblib
