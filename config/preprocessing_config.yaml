root_dataset_prepper:
  root_path: "data/topquarkreconstruction/root_data"
  save_path: "data/topquarkreconstruction/h5py_data/combined"
  train_file_name:  "ttbar_train"
  val_file_name: "ttbar_val"
  test_file_name: "ttbar_test"
  save_file_prefix: "ttbar_h5py_raw_"

preprocessing:
  stream_size: 500000
  save_path: "data/topquarkreconstruction/masked_targets_combined"
  save_file_prefix: "ttbar_preprocessed_"
  min_objects: 1    # keep events with >= this many reconstructable objects
                    # set to 4 to restore original fully-matched-only behaviour
