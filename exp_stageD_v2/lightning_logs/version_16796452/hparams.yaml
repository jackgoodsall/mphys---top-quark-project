config:
  data_modules:
    input_path: data/topquarkreconstruction/masked_targets_combined_v2
    input_prefix: ttbar_preprocessed_
    lazy: true
    load_interactions: true
    test:
      batch_size: 2048
      num_workers: 4
      pin_memory: false
      shuffle: false
    tops_kin_key: kinematics_tops
    tops_mask_key: masks_tops
    train:
      augment:
        eta_flip: false
        phi_rotation: true
      batch_size: 1024
      num_workers: 4
      pin_memory: true
      shuffle: true
    val:
      batch_size: 2048
      num_workers: 4
      pin_memory: false
      shuffle: false
    ws_kin_key: kinematics_Ws
    ws_mask_key: masks_Ws
  inference:
    mode: train
  max_objects: 2
  model_artefacts:
    log_dir: exp_stageD_v2
    target_transformers: data/topquarkreconstruction/masked_targets_combined_v2/target_transforms.joblib
  model_parameters:
    interaction_embedder:
      hidden_layers:
      - 32
      input_features: 4
      output_size: 4
      p_dropout: 0.0
    particle_embedder:
      embedding_size: 128
      hidden_sizes:
      - 64
      n_input: 7
      p_dropout: 0.0
    transformer:
      chain_queries: true
      dim_ff: 512
      embedding_size: 128
      hierarchical_decoding: true
      hierarchy_order: w_first
      mask_logit_scale: true
      masked_attention_start_epoch: 0
      masked_cross_attention: true
      matching_solver: gpu_bruteforce
      max_targets: 10
      mia_interaction_dim: 64
      n_decoder_layers: 6
      n_encoder_layers: 6
      n_gate_queries: 1
      n_gating_layers: 2
      n_heads: 4
      n_mia_layers: 0
      num_query_tokens: 2
      p_dropout: 0.0
      phase1_mask_overwrite: false
      use_hungarian_matching: true
      use_mia_encoder: false
      use_particle_gating: false
      use_vanilla_attention: false
  model_training:
    accelerator: gpu
    devices: 2
    gradient_clip_val: 2
    learning_rate: 2e-4
    matmul_precision: high
    max_epochs: 100
    min_epochs: 15
    num_nodes: 1
    precision: bf16-mixed
    scheduler:
      T_max: 100
      eta_min: 5e-6
      factor: 0.5
      gamma: 0.9
      lr_rewarmup_epochs: 0
      lr_rewarmup_fraction: 1.5
      patience: 3
      plateau_monitor: val_loss
      step_size: 3000
      type: warmup_cosine
      update_interval: step
      warmup_epochs: 5
    seed: null
    strategy: ddp
    use_lookahead: false
    weight_decay: 0.05
  pretraining:
    mask_pretrain_epochs: 0
    tasks:
    - mask_W
    transition_ramp_epochs: 5
  tasks:
    exclusive_ce:
      background: zero
      layer_weights:
        0: 0.1
        1: 0.1
        2: 0.1
        3: 0.3
        4: 0.5
        5: 1.0
      loss_weight: 0.25
    exclusive_ce_W:
      background: zero
      layer_weights:
        0: 0.3
        1: 0.5
        2: 1.0
        3: 0.2
        4: 0.2
        5: 1.0
      loss_weight: 0.25
    invariant_mass:
      huber_delta: 1.0
      layer_weight_strategy: final_only
      loss_weight: 0.05
      m_top: 172.5
      m_w: 80.4
      width_top: 25.0
      width_w: 15.0
    mask:
      bce_weight: 0.5
      cost_bce_weight: 0.5
      cost_weight: 1.0
      dice_weight: 1.0
      layer_weights:
        0: 0.1
        1: 0.1
        2: 0.1
        3: 0.3
        4: 0.5
        5: 1.0
      mask_embed_head: true
      null_mask_penalty: 0.2
    mask_W:
      bce_weight: 0.5
      cost_bce_weight: 0.5
      cost_weight: 1.0
      dice_weight: 1.0
      layer_weights:
        0: 0.3
        1: 0.5
        2: 1.0
        3: 0.2
        4: 0.2
        5: 1.0
      mask_embed_head: true
      null_mask_penalty: 0.1
    mask_consistency:
      layer_weight_strategy: final_only
      loss_weight: 0.1
      margin: 0.0
    objectness:
      enabled: false
  training_callbacks:
    checkpoint:
      filename: epoch={epoch}-val_loss={val_loss:.4f}
      mode: min
      monitor: val_loss
      save_last: true
      save_top_k: 3
      save_weights_only: false
    early_stopping:
      min_delta: 0.0001
      mode: min
      monitor: val_loss
      patience: 20
