[project]
name = "top-quark-reconstruction"
version = "0.1.0"
description = "Transformer-based top quark reconstruction using a DETR-style MaskedFormer architecture with Hungarian matching"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "torch>=2.8.0",
    "pytorch-lightning>=2.5.5",
    "lightning>=2.5.5",
    "torchmetrics>=1.8.2",
    "torch-optimizer>=0.3.0",
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "scikit-learn>=1.5.1",
    "h5py>=3.11.0",
    "matplotlib>=3.9.2",
    "pydantic>=2.8.2",
    "PyYAML>=6.0.1",
    "joblib>=1.4.2",
    "vector>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "ipython",
    "jupyter",
]

[tool.uv]
python = "3.9"
